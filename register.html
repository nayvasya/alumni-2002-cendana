<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Alumni Cendana Rumbai 2002</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="register-form">
    <h2>Join Alumni Cendana Rumbai 2002</h2>
    <form id="registerForm">
      <input type="text" id="fullName" placeholder="Nama lengkap" required>
      <input type="text" id="nickname" placeholder="Nama panggilan" required>
      <input type="text" id="kelas" placeholder="Kelas/jurusan dulu (misal: 3 IPA 2)" required>
      <input type="text" id="domisili" placeholder="Domisili sekarang" required>
      <input type="text" id="kotaAsal" placeholder="Kota asal" required>
      <input type="text" id="whatsapp" placeholder="Nomor WhatsApp" required>
        <label for="birthday">Tanggal lahir</label>
      <input type="date" id="birthday" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <textarea id="dikenalSebagai" placeholder="Dulu dikenal sebagai apa?"></textarea>
      <textarea id="aktivitas" placeholder="Aktivitas/ekskul dulu"></textarea>
      <textarea id="temanDekat" placeholder="Teman dekat waktu sekolah"></textarea>
      <textarea id="kenangan" placeholder="Kenangan yang paling diingat"></textarea>
      <button type="submit">Daftar</button>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="register.js"></script>
</body>
</html>
